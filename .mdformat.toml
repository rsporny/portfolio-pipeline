# Markdown formatting for the repo's hand-written docs.
# Run: `uv run mdformat README.md CLAUDE.md SPEC.md CHANGELOG.md`
# Check (CI): add `--check`. GFM tables/strikethrough come from the mdformat-gfm
# plugin (a dev dependency). evals/RESULTS.md is generated by `pipeline eval`, so
# it is deliberately NOT formatted here.
wrap = 80        # hard-wrap prose at 80 characters (tables/code/URLs can't wrap)
number = true    # keep 1. 2. 3. ordered-list numbering instead of 1. 1. 1.
