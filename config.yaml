github_user: rsporny
repos:
  allowlist:
    - rsporny/portfolio-pipeline
    - midnightntwrk/midnight-node
  descriptions:
    rsporny/portfolio-pipeline: >-
      An automated commit→content pipeline that turns weekly GitHub activity
      into devlog and social drafts via the Claude API, with a human-in-the-loop
      editorial step. Python, typer, httpx, pydantic.
    midnightntwrk/midnight-node: >-
      Midnight blockchain node — a data-protection/privacy-focused network in
      the Cardano ecosystem, built on Substrate (Rust).
# All instance state (raw/, memory/, provenance/, drafts/, approved/, published/)
# resolves under state.root. An instance is one tree — the site repo — holding
# this config, its state, and content/. Run the engine from there ("." = here).
state:
  root: "."
redaction:
  forbidden_phrases: []
  redact_third_party_names: true
output:
  site_repo_path: "."          # the same instance tree; override for a CI checkout
  site_devlog_dir: content/devlog
  adapter: sporny_pl
anthropic:
  model: claude-opus-4-8
  max_tokens: 4000
locale:
  timezone: Europe/Warsaw
content:
  devlog_title_prefix: Senior SDET log
