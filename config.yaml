github_user: rsporny
repos:
  allowlist:
    - rsporny/portfolio-pipeline
    - midnightntwrk/midnight-node
  descriptions:
    rsporny/portfolio-pipeline: >-
      An automated commit→content pipeline that turns weekly GitHub activity
      into devlog and social drafts via the Claude API, with a human-in-the-loop
      editorial step. Python, typer, httpx, pydantic.
    midnightntwrk/midnight-node: >-
      Midnight blockchain node — a data-protection/privacy-focused network in
      the Cardano ecosystem, built on Substrate (Rust).
# All instance state (raw/, memory/, provenance/, drafts/, approved/, published/)
# resolves under state.root. An instance is one tree — the site repo — holding
# this config, its state, and content/. Run the engine from there ("." = here).
state:
  root: "."
redaction:
  forbidden_phrases: []
  redact_third_party_names: true
output:
  site_repo_path: "."          # the same instance tree; override for a CI checkout
  site_devlog_dir: content/devlog
  adapter: sporny_pl
anthropic:
  model: claude-opus-4-8
  max_tokens: 4000
locale:
  timezone: Europe/Warsaw
content:
  devlog_title_prefix: Senior SDET log
  # Published-entry continuity: how many related PAST published entries to feed
  # Stage B so arcs connect across weeks (0 disables; scans site_devlog_dir).
  continuity_max_entries: 3
# v0.5 provenance (optional; dormant unless you sign entries). Signing is a local
# GPG act on the PR branch before merge — no key ever enters CI. Each entry's
# sha256 is anchored per-entry (no merkle tree); anchoring is opt-in: default
# 'null' (none), 'file' (local), or 'cardano' (testnet; needs the `cardano` extra
# + BLOCKFROST_PROJECT_ID / CARDANO_SIGNING_KEY).
provenance:
  enabled: false
  public_key: provenance/pubkey.asc     # armored, resolved under state.root
  signing:
    method: gpg
    gpg_key: ""                         # your signing key fingerprint or uid
  anchor:
    backend: null                       # null | file | cardano
    network: preview                    # preview | preprod (testnet only)
    metadata_label: 8272025
