threads:
- id: memory-and-site-adapter-architecture
  title: 'Neutral core: memory layer and pluggable site adapters'
  status: ongoing
  started_week: 2026-W28
  last_active_week: 2026-W28
  summary: 'The memory layer matured this week: the mutation applier now validates
    every proposed change and rejects unknown thread ids or colliding entries before
    committing, and the two-stage transform became memory-aware via a typed thread_ref
    relation that links detected initiatives to known threads and surfaces assumptions
    due for review. Site-specific rendering (front-matter, manifest schema, per-series
    numbering) sits fully behind a neutral SiteAdapter protocol so the core carries
    no site vocabulary, and weekly plus custom entries share a single manifest numbering
    authority. Raw activity snapshots are committed as a versioned, auditable source
    of truth. The architectural spine for a reusable, forkable core is now in place
    and exercised end-to-end.'
  assumptions:
  - text: A deterministic code-validates-LLM-proposals mutation layer is sufficient
      to keep the memory registry free of silent corruption without human review of
      every change.
    made_week: 2026-W28
    status: open
    review_by: 2026-W36
  - text: The site-adapter protocol is general enough that a second site could be
      added without changing the neutral core.
    made_week: 2026-W28
    status: open
    review_by: 2026-W40
  - text: Threads will meaningfully connect week-over-week rather than accumulating
      as stale entries.
    made_week: 2026-W28
    status: open
    review_by: 2026-W36
  key_decisions:
  - week: 2026-W28
    decision: Separate a neutral core pipeline from site-specific rendering via a
      site-adapter protocol.
    rationale: Keeps the tool reusable, testable, and forkable rather than hard-coded
      to one website.
  - week: 2026-W28
    decision: Adopt a model-proposes / code-disposes pattern for memory mutations.
    rationale: Code validates every LLM-proposed change, keeping an AI-in-the-loop
      system safe from silent corruption.
  - week: 2026-W28
    decision: Commit versioned raw activity snapshots as an auditable source of truth.
    rationale: Makes every published artifact reproducible.
- id: reader-output-and-publishing-automation
  title: Reader-focused output and end-to-end publishing gate
  status: ongoing
  started_week: 2026-W28
  last_active_week: 2026-W28
  summary: 'The reader-focused output and editorial loop were consolidated this week:
    one channel-neutral post with per-initiative categorization, proof-of-work links,
    generalized domain context, and auto-numbered devlog titles. Review and publish
    commands round-trip YAML front-matter, list drafts by status, and publish approved
    entries into the website repo while keeping social and highlights local. A weekly
    GitHub Action collects activity, runs the transform, and opens a PR against the
    website repo with a human merge as the sole publish trigger. Hand-written repository
    context cards seed the transform with accurate domain grounding.'
  assumptions:
  - text: A single channel-neutral post serves the audience better than multilingual/per-channel
      variants.
    made_week: 2026-W28
    status: open
    review_by: 2026-W40
  - text: A human merge gate on the auto-generated weekly PR is the right approval
      step and won't become a bottleneck.
    made_week: 2026-W28
    status: open
    review_by: 2026-W36
  - text: Hand-written repository context cards give the transform enough grounding
      to avoid inaccurate domain claims.
    made_week: 2026-W28
    status: open
    review_by: 2026-W36
  key_decisions:
  - week: 2026-W28
    decision: Automate PR generation into the website repo while keeping a human merge
      gate.
    rationale: Gains automation benefits without the risk of unattended publishing.
  - week: 2026-W28
    decision: Generalize output for non-expert readers and attach proof-of-work links.
    rationale: Makes generated content trustworthy and useful beyond the author.
