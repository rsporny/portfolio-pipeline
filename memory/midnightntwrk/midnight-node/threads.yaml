threads:
- id: bridge-funded-local-network
  title: Self-contained bridge-funded local test network
  status: ongoing
  started_week: 2026-W28
  last_active_week: 2026-W28
  summary: Introduced a first-class self-contained local network with its own on-chain
    ledger identity, decoupled from the shared dev config so one config namespace
    drives both genesis generation and the runtime chain-spec. Cross-chain token supply
    is seeded at genesis and the dev wallet is funded/registered at bring-up by driving
    the real cross-chain bridge end to end. Setup patches static configs in place
    for diffable config drift, and build tooling now regenerates genesis/chain-spec
    without image rebuilds. Previously-disabled contract/DDoS/replay e2e tests were
    revived against the live bridge-funded wallet.
  assumptions:
  - text: Driving the real cross-chain bridge at bring-up gives durable high-fidelity
      e2e coverage without becoming a flaky bottleneck for local network startup.
    made_week: 2026-W28
    status: open
  - text: A single config namespace driving both genesis and runtime chain-spec eliminates
      config drift between the two.
    made_week: 2026-W28
    status: open
  key_decisions:
  - week: 2026-W28
    decision: Give the local network its own on-chain ledger identity, decoupled from
      the shared dev config.
    rationale: Removes latent inconsistencies between genesis and runtime config and
      makes bring-up deterministic and reproducible.
  - week: 2026-W28
    decision: Patch static configs in place at setup rather than generating them dynamically.
    rationale: Config drift surfaces as a reviewable git diff instead of hidden runtime
      divergence.
  - week: 2026-W28
    decision: Exercise the real cross-chain bridge (mint, pre-approve, claim, register)
      at bring-up instead of hand-crafted fixtures.
    rationale: Provides high-fidelity end-to-end coverage of a critical feature.
- id: cnight-observation-nightly-reliability
  title: cNIGHT observation nightly stabilization
  status: ongoing
  started_week: 2026-W28
  last_active_week: 2026-W28
  summary: Diagnosed and fixed a nightly observation e2e suite that had been red for
    weeks due to stacked causes, documented across twelve instrumented verification
    runs. Fixes included budgeting timeouts to a degraded upstream block rate, a stall
    detector, retargeting from a 1.x-runtime chain (where the wallet-state cache was
    a silent no-op) onto a 2.x-runtime chain, and hardened transport resilience (retries/backoff,
    client eviction, resubmission recovery, concurrency gating, faucet contention
    recovery, fail-fast endpoint smoke test). A bridge happy-path walkthrough doc
    was also written.
  assumptions:
  - text: Retargeting the observation suite onto the 2.x-runtime chain restores a
      reliable nightly signal without losing coverage.
    made_week: 2026-W28
    status: open
  - text: The stacked transport-resilience hardening addresses genuine flakes rather
      than masking a remaining systematic failure that will resurface.
    made_week: 2026-W28
    status: open
  key_decisions:
  - week: 2026-W28
    decision: Retarget the suite from a 1.x-runtime chain to a 2.x-runtime chain with
      identical coverage.
    rationale: On 1.x the wallet-state cache was a silent no-op forcing full genesis
      replays; 2.x makes caching effective.
  - week: 2026-W28
    decision: Add fail-fast pre-run endpoint smoke tests and a stall detector.
    rationale: Turns multi-hour silent failures into fast, actionable errors and separates
      environmental degradation from real flakes.
- id: fault-injection-node-robustness
  title: Fault-injection-driven node & toolkit robustness
  status: ongoing
  started_week: 2026-W28
  last_active_week: 2026-W28
  summary: Hardening node and toolkit behavior against adverse network conditions,
    largely surfaced by fault-injection testing. Replaced panics with clean error
    returns in the transaction-generator toolkit and used saturating subtraction in
    the block fetcher to prevent an underflow-to-SIGABRT when a load-balanced RPC
    replica lags the cache watermark. Re-anchored the on-chain observation sliding
    window to a reorg-safety margin behind the follower so genesis-synced and restart-with-state
    nodes converge to the same near-tip window, eliminating unbounded memory growth.
    Also backported a devnet committee D-parameter change (6→7 seats) to raise finality
    fault tolerance.
  assumptions:
  - text: Re-anchoring the observation sliding window to a reorg-safety margin behind
      the follower bounds memory regardless of sync history.
    made_week: 2026-W28
    status: open
  - text: Fault-injection (Antithesis) testing will keep surfacing latent panic/arithmetic
      conditions worth systematically hardening.
    made_week: 2026-W28
    status: open
  key_decisions:
  - week: 2026-W28
    decision: Surface expected runtime conditions (insufficient funds, lagging replica)
      as clean error returns/non-zero exits instead of panics.
    rationale: Makes CLI and node behavior predictable under adverse conditions instead
      of crashing test workloads.
  - week: 2026-W28
    decision: Raise the devnet committee D-parameter from 6 to 7 seats.
    rationale: Increases finality fault tolerance from one to two concurrent non-voting
      validators.
