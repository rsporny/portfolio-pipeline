threads:
- id: local-network-cross-chain-bridge
  title: Self-contained local network with cross-chain bridge funding
  status: ongoing
  started_week: 2026-W28
  last_active_week: 2026-W28
  summary: Established a first-class dedicated local network with its own on-chain
    ledger identity, decoupled from shared dev config so a single config namespace
    drives both genesis generation and the runtime chain spec. Seeded the source-chain
    side of the cross-chain token bridge at genesis to preserve supply invariants,
    bootstrapped a dev wallet end-to-end via a genesis-pre-approved bridge transfer
    (claim tokens, register operational resource token) with no governance round,
    and introduced deterministic in-place config patching so drift surfaces as a git
    diff. Contract, DDoS, and liveness end-to-end tests were revived against the runtime-funded
    wallet, and the network struct was collapsed onto the dynamic custom-network path
    since all values are known only at runtime.
  assumptions:
  - text: A single config namespace driving both genesis and runtime chain spec eliminates
      latent config inconsistencies for the local network.
    made_week: 2026-W28
    status: open
    review_by: 2026-W40
  - text: Genesis-seeded Cardano bridge supply correctly mirrors on-chain pools so
      cross-chain supply invariants hold in the local environment.
    made_week: 2026-W28
    status: open
    review_by: 2026-W36
  - text: Collapsing the network struct onto the dynamic custom-network path (all
      values known only at runtime) does not lose configuration expressiveness needed
      by future network variants.
    made_week: 2026-W28
    status: open
    review_by: 2026-W40
  key_decisions:
  - week: 2026-W28
    decision: Give the local network its own on-chain ledger identity, decoupled from
      shared dev configuration.
    rationale: A self-contained, reproducible environment lets developers exercise
      the full cross-chain bridge flow offline without shared-config coupling.
  - week: 2026-W28
    decision: Use deterministic in-place config patching from deployed contract addresses.
    rationale: Turns configuration drift into a visible git diff signal rather than
      a silent failure.
- id: cnight-observation-nightly-reliability
  title: cNIGHT observation nightly reliability and toolkit hardening
  status: ongoing
  started_week: 2026-W28
  last_active_week: 2026-W28
  summary: 'Recovered a long-red cross-chain observation nightly by isolating stacked
    root causes across twelve instrumented runs: a degraded upstream block rate outgrowing
    fixed timeouts, a silently no-opping wallet cache on older runtimes, and post-await
    transport flakes. Retargeted the nightly at a runtime-compatible devnet, replaced
    fixed timeouts with block-span-aware budgets plus a stall detector, added retry/backoff
    and client eviction, gated concurrent replays behind semaphores, and hardened
    the shared faucet against cross-run UTXO contention. Separately converted toolkit
    panics (insufficient-funds, fetcher arithmetic underflow) surfaced by fault-injection
    testing into clean errors and re-anchored an oversized in-memory observation window
    to the reorg-safety margin.'
  assumptions:
  - text: Block-span-aware timeout budgets plus a stall detector keep the observation
      nightly green under variable upstream block rates.
    made_week: 2026-W28
    status: open
    review_by: 2026-W34
  - text: The wallet cache no-op on older-runtime chains was a genuine root cause
      and retargeting to a compatible runtime resolves it durably.
    made_week: 2026-W28
    status: open
    review_by: 2026-W36
  key_decisions:
  - week: 2026-W28
    decision: Diagnose the flaky nightly per-layer rather than seeking a single root
      cause.
    rationale: Long-running distributed suites fail for stacked reasons; systematic
      per-layer resilience hardening is what restores a reliable signal.
  - week: 2026-W28
    decision: Bound the in-memory observation window to a reorg-safety margin.
    rationale: Caps memory growth on from-genesis sync while preserving reorg correctness.
- id: consensus-finality-fault-tolerance
  title: Consensus committee sizing and finality fault tolerance
  status: ongoing
  started_week: 2026-W28
  last_active_week: 2026-W28
  summary: Backported a committee-size increase (6 to 7 validator seats) to a release
    branch, raising finality fault tolerance from one to two concurrent non-voting
    validators to mitigate an observed finality stall when two validators lagged simultaneously
    and dropped prevotes below the supermajority threshold. Regenerated the affected
    chain-spec and its recorded hash to keep config and generated artifacts self-consistent,
    alongside a supporting CI/Docker package-pin fix so the branch builds cleanly.
  assumptions:
  - text: Raising the committee to 7 seats resolves the observed finality stall under
      two simultaneously lagging validators in production.
    made_week: 2026-W28
    status: open
    review_by: 2026-W36
  key_decisions:
  - week: 2026-W28
    decision: Backport the committee-size change to a release branch rather than only
      landing it on main.
    rationale: Applies a known-good production fix to the release line before deployment,
      since committee sizing directly determines survivable validator outages.
