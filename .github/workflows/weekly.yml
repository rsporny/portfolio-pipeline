name: Weekly devlog

on:
  schedule:
    - cron: "0 16 * * 0" # Sundays 16:00 UTC (18:00 CEST)
  workflow_dispatch:
    inputs:
      since:
        description: "Start date YYYY-MM-DD (default: last 7 days)"
        required: false
      until:
        description: "End date YYYY-MM-DD (default: now); pair with 'since' to backfill a past week exactly"
        required: false
      focus:
        description: "Thread id(s) to lead on, space-separated (default: model auto-picks)"
        required: false

# The engine is stateless (v0.4.1): it commits NOTHING back to this repo, so it
# needs no write access here. The instance — config + state (raw/, memory/) +
# content — lives in the site repo, reached with the scoped LANDING_PAGE_TOKEN.
# The single weekly PR bundles the rendered devlog with its raw/ + memory/ state;
# the Action only opens that PR — a human merges to publish (Cloudflare deploys).
permissions:
  contents: read

concurrency:
  group: weekly-devlog
  cancel-in-progress: false

# NOTE: requires the instance (rsporny/landing-page) to hold config.yaml with
# `state.root: "."` + `output.site_repo_path: "."`, plus raw/ + memory/, and to
# gitignore the drafts/ approved/ published/ working dirs. This workflow can only
# be validated once that migration has landed.
jobs:
  devlog:
    runs-on: ubuntu-latest
    env:
      # The engine's console script, installed into the tool checkout's venv. It
      # is run from the site checkout (cwd) so all state resolves under state.root.
      PIPELINE: ${{ github.workspace }}/.venv/bin/pipeline
    steps:
      - name: Checkout engine
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Install engine
        run: uv sync

      - name: Checkout instance (config + state + content)
        uses: actions/checkout@v4
        with:
          repository: rsporny/landing-page
          token: ${{ secrets.LANDING_PAGE_TOKEN }}
          path: site

      - name: Resolve state root
        # Read the instance's own state.root from its config so this workflow
        # works for any layout (.pipeline/, repo root, a fork's choice) without
        # hardcoding where state lives.
        working-directory: site
        run: |
          SR=$("$GITHUB_WORKSPACE/.venv/bin/python" -c "import yaml;print((yaml.safe_load(open('config.yaml')).get('state') or {}).get('root','.'))")
          echo "STATE_ROOT=$SR" >> "$GITHUB_ENV"
          echo "state.root=$SR"

      - name: Collect activity
        working-directory: site
        env:
          # Fine-grained PAT: read-only contents/PRs/issues on the allowlisted repos.
          GH_ACTIVITY_TOKEN: ${{ secrets.GH_ACTIVITY_TOKEN }}
        run: |
          # Empty on scheduled runs → default rolling 7-day window. Dates are
          # YYYY-MM-DD (no spaces), so unquoted expansion is safe.
          ARGS=""
          if [ -n "${{ github.event.inputs.since }}" ]; then
            ARGS="$ARGS --since ${{ github.event.inputs.since }}"
          fi
          if [ -n "${{ github.event.inputs.until }}" ]; then
            ARGS="$ARGS --until ${{ github.event.inputs.until }}"
          fi
          "$PIPELINE" collect $ARGS

      - name: Resolve week and activity
        id: meta
        working-directory: site
        run: |
          WEEK=$(ls -d "$STATE_ROOT"/raw/*/ 2>/dev/null | sort | tail -1 | xargs -r basename)
          HAS=false
          if [ -n "$WEEK" ]; then
            HAS=$("$GITHUB_WORKSPACE/.venv/bin/python" -c "import json; a=json.load(open('$STATE_ROOT/raw/$WEEK/activity.json')); print('true' if any(r['commits'] or r['pull_requests'] or r['issues'] for r in a['repos']) else 'false')")
          fi
          echo "week=$WEEK" >> "$GITHUB_OUTPUT"
          echo "has_activity=$HAS" >> "$GITHUB_OUTPUT"
          echo "Resolved week=$WEEK has_activity=$HAS"

      - name: Transform (two-stage AI)
        if: steps.meta.outputs.has_activity == 'true'
        working-directory: site
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Optional manual override; empty on cron runs, so the model auto-picks.
          FOCUS: ${{ github.event.inputs.focus }}
        run: |
          args=(--week "${{ steps.meta.outputs.week }}")
          for f in $FOCUS; do args+=(--focus "$f"); done
          "$PIPELINE" transform "${args[@]}"

      - name: Render devlog into the site
        if: steps.meta.outputs.has_activity == 'true'
        working-directory: site
        run: |
          WEEK="${{ steps.meta.outputs.week }}"
          mkdir -p "$STATE_ROOT/approved"
          cp -r "$STATE_ROOT/drafts/$WEEK" "$STATE_ROOT/approved/$WEEK"
          # state.root and site_repo_path both resolve to this tree, so the devlog
          # + manifest land in content/devlog right here — one repo, no --site-repo.
          "$PIPELINE" publish

      - name: Build PR body
        if: steps.meta.outputs.has_activity == 'true'
        id: prbody
        working-directory: site
        run: |
          WEEK="${{ steps.meta.outputs.week }}"
          strip() { awk '/^---$/{c++; next} c>=2' "$1"; }  # drop YAML front matter
          {
            echo "Automated devlog for **$WEEK**, bundled with its \`raw/\` + \`memory/\` state."
            echo
            echo "Review the \`content/devlog/$WEEK.md\` diff and **merge to publish** — Cloudflare deploys on merge. To change anything, edit this PR first."
            echo
            echo "### Social post (copy to LinkedIn / X)"
            echo
            strip "$STATE_ROOT/published/$WEEK/social.md"
            echo
            echo "### Highlights"
            echo
            strip "$STATE_ROOT/published/$WEEK/highlights.md"
          } > "$GITHUB_WORKSPACE/pr-body.md"
          {
            echo "body<<PRBODY"
            cat "$GITHUB_WORKSPACE/pr-body.md"
            echo "PRBODY"
          } >> "$GITHUB_OUTPUT"

      - name: Open the weekly PR (devlog + state) to the instance
        if: steps.meta.outputs.has_activity == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.LANDING_PAGE_TOKEN }}
          path: site
          base: main
          branch: devlog/${{ steps.meta.outputs.week }}
          delete-branch: true
          # One atomic PR: the rendered content plus the week's committed state.
          # Working dirs (drafts/approved/published) are excluded from the commit.
          add-paths: |
            content/devlog
            ${{ env.STATE_ROOT }}/raw
            ${{ env.STATE_ROOT }}/memory
          commit-message: "devlog: ${{ steps.meta.outputs.week }} (+ raw/memory state)"
          title: "Devlog: ${{ steps.meta.outputs.week }}"
          body: ${{ steps.prbody.outputs.body }}

      - name: Upload run artifacts (audit)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-run-${{ steps.meta.outputs.week }}
          path: |
            site/${{ env.STATE_ROOT }}/raw
            site/${{ env.STATE_ROOT }}/drafts
          if-no-files-found: ignore
